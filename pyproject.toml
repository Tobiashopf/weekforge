[project]
name = "weekforge"
version = "0.1.0"
description = "Self-hosted weekly planner with habit tracking, performance metrics and notifications."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tobias Hopf" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
