<li id="task-{{ task.id }}" class="task{% if task.done %} done{% endif %}">
  <button hx-post="/tasks/{{ task.id }}/toggle" hx-target="#task-{{ task.id }}" hx-swap="outerHTML"
          class="check" aria-pressed="{{ 'true' if task.done else 'false' }}"
          aria-label="{{ 'Desmarcar' if task.done else 'Concluir' }} {{ task.title }}">
    {% if task.done %}✓{% endif %}
  </button>
  <span>{{ task.title }}</span>
</li>
